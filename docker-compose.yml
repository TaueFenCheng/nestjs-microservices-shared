# 本地开发依赖基础设施
# 启动:docker compose up -d
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: ms-shared-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

